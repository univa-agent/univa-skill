name: video-understand
version: "2.0"
description: >
  Deep video/image understanding pipeline with supplementary refinement.
  Upload media → analyze deeply → present structured results → prompt for
  supplementary info → refine understanding → finalize.
  Uses video_understanding MCP tool: vision2text_gen.
category: analysis
stability: beta

default_checkpoint_policy: guided

orchestration:
  mode: executive-producer
  skill: pipelines/video-understand/executive-producer
  budget_default_usd: 0.15
  max_revisions_per_stage: 2

required_skills:
  - pipelines/video-understand/executive-producer
  - pipelines/video-understand/analyze-director
  - pipelines/video-understand/present-director
  - pipelines/video-understand/refine-director
  - meta/reviewer
  - meta/checkpoint-protocol
  - core/video-understanding
  - creative/video-analysis

stages:
  # ── Stage 1: Media Analysis ────────────────────────────────────────

  - name: analyze
    skill: pipelines/video-understand/analyze-director
    produces:
      - raw_analysis
    required_tools:
      - vision2text_gen
    tools_available:
      - vision2text_gen
    checkpoint_required: false
    human_approval_default: false
    review_focus:
      - Media identified and file exists
      - Analysis dimensions selected (content, style, quality, structure)
      - vision2text_gen called with appropriate prompt template
      - Raw analysis contains substantive, detailed results
    success_criteria:
      - raw_analysis contains multi-dimensional findings
      - raw_analysis covers: subject, objects, scene, atmosphere, colors, style

  # ── Stage 2: Present Results ───────────────────────────────────────

  - name: present
    skill: pipelines/video-understand/present-director
    required_artifacts_in:
      - raw_analysis
    produces:
      - structured_report
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Results presented in structured format (JSON + natural language summary)
      - Key findings highlighted for quick reading
      - User prompted: "You can add details to deepen the analysis."
      - Supplementary entry point clearly visible
    success_criteria:
      - structured_report contains formatted analysis
      - User can see the "supplement" prompt

  # ── Stage 3: Supplementary Refinement ───────────────────────────────

  - name: refine
    skill: pipelines/video-understand/refine-director
    required_artifacts_in:
      - structured_report
      - raw_analysis
    produces:
      - final_analysis
    tools_available:
      - vision2text_gen
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - User's supplementary info incorporated into analysis
      - If user provides new details, re-query with enhanced prompt
      - Final analysis is deeper and more accurate than initial
      - If user says "no supplement needed", finalize current analysis
    success_criteria:
      - final_analysis is more refined than raw_analysis
      - User confirms satisfaction or declines further refinement
